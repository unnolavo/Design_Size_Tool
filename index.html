<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Measurement Tool (v1)</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --line: #d7deea;
      --text: #1d2430;
      --muted: #5d6b80;
      --primary: #2359ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .app {
      max-width: 1120px;
      margin: 24px auto;
      padding: 0 16px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(12, 25, 48, 0.06);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.5rem;
    }

    .lead {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .controls {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .control {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .control label {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .control input,
    .control select,
    .control button {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 10px;
      background: #fff;
      color: var(--text);
      font-size: 0.9rem;
    }

    .control button {
      cursor: pointer;
      font-weight: 600;
    }

    .control .btn-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .control button.zoom-btn {
      min-height: 36px;
      padding: 0 8px;
      font-size: 0.88rem;
      flex: 1;
      min-width: 84px;
    }

    .control button.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .canvas-wrap {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #f0f3f8;
      overflow: hidden;
      position: relative;
    }

    .pan-pad {
      position: absolute;
      left: 14px;
      bottom: 14px;
      width: 92px;
      height: 92px;
      border-radius: 50%;
      border: 1px solid #a7b4c7;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(2px);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      place-items: center;
      z-index: 5;
    }

    .pan-btn {
      width: 28px;
      height: 28px;
      border: 1px solid #c6cfdd;
      border-radius: 999px;
      background: #fff;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      color: #334155;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .pan-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .pan-up { grid-column: 2; grid-row: 1; }
    .pan-left { grid-column: 1; grid-row: 2; }
    .pan-center { grid-column: 2; grid-row: 2; width: 18px; height: 18px; border-radius: 999px; background: #cfd8e6; }
    .pan-right { grid-column: 3; grid-row: 2; }
    .pan-down { grid-column: 2; grid-row: 3; }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      cursor: crosshair;
      user-select: none;
    }

    .status-row {
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 0.9rem;
    }

    #hint {
      font-weight: 600;
      color: #8a5b00;
    }

    .control.file-upload { min-width: 260px; }
    .control.reference-value { min-width: 130px; }
    .control.reference-unit { min-width: 140px; }
    .control.set-ref { min-width: 126px; }
    .control.zoom-group { min-width: 190px; }
    .row-break { flex-basis: 100%; height: 0; }
    .controls-spacer { flex: 1; min-width: 20px; }
    .control.actions { min-width: 108px; }
  </style>
</head>
<body>
  <main class="app">
    <section class="panel">
      <h1>Image Measurement Tool</h1>
      <p class="lead">
        Upload an image, draw a reference line with known size, then measure anything else.
      </p>

      <div class="controls">
        <div class="control file-upload">
          <label for="imageInput">Image upload</label>
          <input id="imageInput" type="file" accept="image/*" />
        </div>

        <div class="control reference-value">
          <label for="referenceValue">Reference value</label>
          <input id="referenceValue" type="number" min="0" step="any" placeholder="e.g. 5" disabled />
        </div>

        <div class="control reference-unit">
          <label for="referenceUnit">Reference unit</label>
          <select id="referenceUnit" disabled>
            <option value="in">inches</option>
            <option value="cm">centimeters</option>
          </select>
        </div>

        <div class="control set-ref">
          <label>&nbsp;</label>
          <button id="setReferenceBtn" class="primary" disabled>Set Reference</button>
        </div>

        <div class="row-break" aria-hidden="true"></div>

        <div class="control zoom-group">
          <label>Zoom</label>
          <div class="btn-row">
            <button id="zoomInBtn" class="zoom-btn" type="button" disabled>Zoom +</button>
            <button id="zoomOutBtn" class="zoom-btn" type="button" disabled>Zoom -</button>
          </div>
        </div>

        <div class="controls-spacer"></div>

        <div class="control actions">
          <label>&nbsp;</label>
          <button id="undoBtn" type="button" disabled>Undo Last</button>
        </div>

        <div class="control actions">
          <label>&nbsp;</label>
          <button id="clearBtn" type="button" disabled>Clear Lines</button>
        </div>

        <div class="control actions">
          <label>&nbsp;</label>
          <button id="resetBtn" type="button" disabled>Reset All</button>
        </div>
      </div>

      <div class="canvas-wrap">
        <canvas id="measureCanvas" width="1000" height="620"></canvas>
        <div class="pan-pad" aria-label="Image nudge controls">
          <button id="panUpBtn" class="pan-btn pan-up" type="button" disabled>^</button>
          <button id="panLeftBtn" class="pan-btn pan-left" type="button" disabled>&lt;</button>
          <div class="pan-center" aria-hidden="true"></div>
          <button id="panRightBtn" class="pan-btn pan-right" type="button" disabled>&gt;</button>
          <button id="panDownBtn" class="pan-btn pan-down" type="button" disabled>v</button>
        </div>
      </div>

      <div class="status-row">
        <div id="status">Status: Upload an image to begin.</div>
        <div id="hint">Hint: Draw a reference line first.</div>
      </div>
    </section>
  </main>

  <script>
    const imageInput = document.getElementById('imageInput');
    const referenceValue = document.getElementById('referenceValue');
    const referenceUnit = document.getElementById('referenceUnit');
    const setReferenceBtn = document.getElementById('setReferenceBtn');
    const zoomInBtn = document.getElementById('zoomInBtn');
    const zoomOutBtn = document.getElementById('zoomOutBtn');
    const undoBtn = document.getElementById('undoBtn');
    const clearBtn = document.getElementById('clearBtn');
    const resetBtn = document.getElementById('resetBtn');
    const panUpBtn = document.getElementById('panUpBtn');
    const panLeftBtn = document.getElementById('panLeftBtn');
    const panRightBtn = document.getElementById('panRightBtn');
    const panDownBtn = document.getElementById('panDownBtn');
    const status = document.getElementById('status');
    const hint = document.getElementById('hint');

    const canvas = document.getElementById('measureCanvas');
    const ctx = canvas.getContext('2d');

    const state = {
      image: null,
      lines: [],
      draftLine: null,
      endpointDrag: null,
      selectedLineIndex: null,
      scaleInchesPerImagePixel: null,
      reference: {
        lineIndex: null,
        knownInches: null
      },
      viewport: {
        zoom: 1,
        minZoom: 0.2,
        maxZoom: 4,
        baseScale: 1,
        offsetX: 0,
        offsetY: 0
      }
    };

    function setStatus(text) {
      status.textContent = `Status: ${text}`;
    }

    function setControlsEnabled(enabled) {
      referenceValue.disabled = !enabled;
      referenceUnit.disabled = !enabled;
      setReferenceBtn.disabled = !enabled;
      zoomInBtn.disabled = !enabled;
      zoomOutBtn.disabled = !enabled;
      undoBtn.disabled = !enabled;
      clearBtn.disabled = !enabled;
      resetBtn.disabled = !enabled;
      panUpBtn.disabled = !enabled;
      panLeftBtn.disabled = !enabled;
      panRightBtn.disabled = !enabled;
      panDownBtn.disabled = !enabled;
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function fitImageToCanvas() {
      if (!state.image) return;

      const img = state.image;
      const fitX = canvas.width / img.width;
      const fitY = canvas.height / img.height;
      const baseScale = Math.min(fitX, fitY);

      state.viewport.baseScale = baseScale;
      state.viewport.zoom = 1;

      const drawWidth = img.width * baseScale;
      const drawHeight = img.height * baseScale;

      state.viewport.offsetX = (canvas.width - drawWidth) / 2;
      state.viewport.offsetY = (canvas.height - drawHeight) / 2;
    }

    function toImagePoint(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const canvasX = ((clientX - rect.left) / rect.width) * canvas.width;
      const canvasY = ((clientY - rect.top) / rect.height) * canvas.height;
      const totalScale = state.viewport.baseScale * state.viewport.zoom;

      return {
        canvasX,
        canvasY,
        imageX: (canvasX - state.viewport.offsetX) / totalScale,
        imageY: (canvasY - state.viewport.offsetY) / totalScale
      };
    }

    function imageToCanvasPoint(imageX, imageY) {
      const totalScale = state.viewport.baseScale * state.viewport.zoom;
      return {
        x: state.viewport.offsetX + imageX * totalScale,
        y: state.viewport.offsetY + imageY * totalScale
      };
    }

    function drawLineOverlay(line, index, isSelected = false) {
      const start = imageToCanvasPoint(line.startX, line.startY);
      const end = imageToCanvasPoint(line.endX, line.endY);
      const midX = (start.x + end.x) / 2;
      const midY = (start.y + end.y) / 2;
      const strokeColor = line.type === 'reference' ? '#d97706' : '#2563eb';

      ctx.beginPath();
      ctx.moveTo(start.x, start.y);
      ctx.lineTo(end.x, end.y);
      ctx.strokeStyle = strokeColor;
      ctx.lineWidth = isSelected ? 3.4 : 2.4;
      ctx.stroke();

      ctx.fillStyle = strokeColor;
      ctx.beginPath();
      ctx.arc(start.x, start.y, 3, 0, Math.PI * 2);
      ctx.arc(end.x, end.y, 3, 0, Math.PI * 2);
      ctx.fill();

      ctx.font = '12px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      const refInches = state.reference.knownInches;
      const refCm = refInches ? refInches * 2.54 : null;
      const measuredText = line.type === 'measurement' ? formatDualUnitsFromLine(line) : null;
      const label = line.type === 'reference'
        ? (refInches
          ? `Reference: ${refInches.toFixed(2)} in / ${refCm.toFixed(2)} cm`
          : 'Reference line (set known size next)')
        : (measuredText ? measuredText : `Line ${index} (set reference)`);
      ctx.fillText(label, midX, midY - 6);
    }

    function findEndpointHit(canvasX, canvasY) {
      const hitRadius = 9;
      for (let i = state.lines.length - 1; i >= 0; i -= 1) {
        const line = state.lines[i];
        const start = imageToCanvasPoint(line.startX, line.startY);
        const end = imageToCanvasPoint(line.endX, line.endY);
        const startDist = Math.hypot(canvasX - start.x, canvasY - start.y);
        if (startDist <= hitRadius) {
          return { lineIndex: i, endpoint: 'start' };
        }
        const endDist = Math.hypot(canvasX - end.x, canvasY - end.y);
        if (endDist <= hitRadius) {
          return { lineIndex: i, endpoint: 'end' };
        }
      }
      return null;
    }

    function pointToSegmentDistance(px, py, x1, y1, x2, y2) {
      const dx = x2 - x1;
      const dy = y2 - y1;
      const segmentLengthSq = dx * dx + dy * dy;
      if (segmentLengthSq === 0) return Math.hypot(px - x1, py - y1);
      const t = Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / segmentLengthSq));
      const projX = x1 + t * dx;
      const projY = y1 + t * dy;
      return Math.hypot(px - projX, py - projY);
    }

    function findLineHit(canvasX, canvasY) {
      const hitThreshold = 7;
      for (let i = state.lines.length - 1; i >= 0; i -= 1) {
        const line = state.lines[i];
        const start = imageToCanvasPoint(line.startX, line.startY);
        const end = imageToCanvasPoint(line.endX, line.endY);
        const dist = pointToSegmentDistance(canvasX, canvasY, start.x, start.y, end.x, end.y);
        if (dist <= hitThreshold) {
          return i;
        }
      }
      return null;
    }

    function lineLengthInImagePixels(line) {
      return Math.hypot(line.endX - line.startX, line.endY - line.startY);
    }

    function formatDualUnitsFromLine(line) {
      if (!state.scaleInchesPerImagePixel) return null;
      const lengthPx = lineLengthInImagePixels(line);
      const inches = lengthPx * state.scaleInchesPerImagePixel;
      const cm = inches * 2.54;
      return `${inches.toFixed(2)} in / ${cm.toFixed(2)} cm`;
    }

    function syncScaleFromReferenceLine() {
      if (state.reference.lineIndex === null || !state.reference.knownInches) {
        state.scaleInchesPerImagePixel = null;
        return;
      }
      const refLine = state.lines[state.reference.lineIndex];
      if (!refLine) {
        state.scaleInchesPerImagePixel = null;
        return;
      }
      const lengthPx = lineLengthInImagePixels(refLine);
      if (lengthPx <= 0) {
        state.scaleInchesPerImagePixel = null;
        return;
      }
      state.scaleInchesPerImagePixel = state.reference.knownInches / lengthPx;
    }

    function zoomAtCanvasPoint(targetZoom, centerCanvasX, centerCanvasY) {
      if (!state.image) return;

      const previousZoom = state.viewport.zoom;
      const clampedZoom = clamp(targetZoom, state.viewport.minZoom, state.viewport.maxZoom);
      if (clampedZoom === previousZoom) return;

      const oldScale = state.viewport.baseScale * previousZoom;
      const newScale = state.viewport.baseScale * clampedZoom;

      const imageX = (centerCanvasX - state.viewport.offsetX) / oldScale;
      const imageY = (centerCanvasY - state.viewport.offsetY) / oldScale;

      state.viewport.zoom = clampedZoom;
      state.viewport.offsetX = centerCanvasX - imageX * newScale;
      state.viewport.offsetY = centerCanvasY - imageY * newScale;
      draw();
      setStatus(`Zoom: ${(state.viewport.zoom * 100).toFixed(0)}%`);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (!state.image) {
        ctx.fillStyle = '#95a2b3';
        ctx.font = '16px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('Upload an image to begin', canvas.width / 2, canvas.height / 2);
        return;
      }

      const img = state.image;
      const totalScale = state.viewport.baseScale * state.viewport.zoom;
      const drawWidth = img.width * totalScale;
      const drawHeight = img.height * totalScale;

      ctx.drawImage(
        img,
        state.viewport.offsetX,
        state.viewport.offsetY,
        drawWidth,
        drawHeight
      );

      state.lines.forEach((line, index) => drawLineOverlay(line, index + 1, state.selectedLineIndex === index));
      if (state.draftLine) {
        drawLineOverlay(state.draftLine, state.lines.length + 1, true);
      }
    }

    function loadImageFromFile(file) {
      const url = URL.createObjectURL(file);
      const image = new Image();
      image.onload = () => {
        state.image = image;
        state.lines = [];
        state.draftLine = null;
        state.endpointDrag = null;
        state.selectedLineIndex = null;
        state.scaleInchesPerImagePixel = null;
        state.reference.lineIndex = null;
        state.reference.knownInches = null;
        fitImageToCanvas();
        draw();
        URL.revokeObjectURL(url);
        setControlsEnabled(true);
        setStatus('Image loaded. Next: draw a reference line.');
      };
      image.onerror = () => {
        URL.revokeObjectURL(url);
        setStatus('Could not load image. Try another file.');
      };
      image.src = url;
    }

    imageInput.addEventListener('change', (event) => {
      const file = event.target.files && event.target.files[0];
      if (!file) return;

      loadImageFromFile(file);
    });

    zoomInBtn.addEventListener('click', () => {
      if (!state.image) return;
      zoomAtCanvasPoint(state.viewport.zoom * 1.2, canvas.width / 2, canvas.height / 2);
    });

    zoomOutBtn.addEventListener('click', () => {
      if (!state.image) return;
      zoomAtCanvasPoint(state.viewport.zoom / 1.2, canvas.width / 2, canvas.height / 2);
    });

    canvas.addEventListener('wheel', (event) => {
      if (!state.image) return;
      event.preventDefault();

      const zoomFactor = event.deltaY < 0 ? 1.1 : 1 / 1.1;
      const point = toImagePoint(event.clientX, event.clientY);
      zoomAtCanvasPoint(state.viewport.zoom * zoomFactor, point.canvasX, point.canvasY);
    }, { passive: false });

    function nudgeImage(deltaX, deltaY) {
      if (!state.image) return;
      state.viewport.offsetX += deltaX;
      state.viewport.offsetY += deltaY;
      draw();
    }

    panLeftBtn.addEventListener('click', () => nudgeImage(-24, 0));
    panRightBtn.addEventListener('click', () => nudgeImage(24, 0));
    panUpBtn.addEventListener('click', () => nudgeImage(0, -24));
    panDownBtn.addEventListener('click', () => nudgeImage(0, 24));

    canvas.addEventListener('mousedown', (event) => {
      if (!state.image) return;
      const point = toImagePoint(event.clientX, event.clientY);
      const hit = findEndpointHit(point.canvasX, point.canvasY);

      if (hit) {
        state.endpointDrag = hit;
        state.selectedLineIndex = hit.lineIndex;
        canvas.style.cursor = 'grabbing';
        return;
      }

      const lineHitIndex = findLineHit(point.canvasX, point.canvasY);
      if (lineHitIndex !== null) {
        state.selectedLineIndex = lineHitIndex;
        draw();
        setStatus(`Selected line ${lineHitIndex + 1}. Click "Set Reference" to redefine scale.`);
        return;
      }

      const lineType = state.lines.length === 0 ? 'reference' : 'measurement';

      hint.textContent = '';
      state.draftLine = {
        type: lineType,
        startX: point.imageX,
        startY: point.imageY,
        endX: point.imageX,
        endY: point.imageY
      };
      draw();
    });

    canvas.addEventListener('mousemove', (event) => {
      if (!state.image) return;
      const point = toImagePoint(event.clientX, event.clientY);

      if (state.endpointDrag) {
        const targetLine = state.lines[state.endpointDrag.lineIndex];
        if (!targetLine) return;

        if (state.endpointDrag.endpoint === 'start') {
          targetLine.startX = point.imageX;
          targetLine.startY = point.imageY;
        } else {
          targetLine.endX = point.imageX;
          targetLine.endY = point.imageY;
        }
        draw();
        return;
      }

      if (state.draftLine) {
        state.draftLine.endX = point.imageX;
        state.draftLine.endY = point.imageY;
        draw();
        return;
      }

      const hoverHit = findEndpointHit(point.canvasX, point.canvasY);
      canvas.style.cursor = hoverHit ? 'grab' : 'crosshair';
    });

    window.addEventListener('mouseup', () => {
      if (!state.image) return;

      if (state.endpointDrag) {
        state.endpointDrag = null;
        canvas.style.cursor = 'crosshair';
        syncScaleFromReferenceLine();
        draw();
        setStatus('Line endpoint adjusted.');
        return;
      }

      if (!state.draftLine) return;
      const line = state.draftLine;
      const dx = line.endX - line.startX;
      const dy = line.endY - line.startY;
      const pixelLength = Math.hypot(dx, dy);
      state.draftLine = null;

      if (pixelLength < 3) {
        draw();
        return;
      }

      state.lines.push(line);
      state.selectedLineIndex = state.lines.length - 1;
      draw();

      if (line.type === 'reference') {
        setStatus('Reference line drawn. Enter known value in Stage 3 flow.');
      } else {
        const measuredText = formatDualUnitsFromLine(line);
        setStatus(measuredText
          ? `Line ${state.lines.length} added: ${measuredText}`
          : `Line ${state.lines.length} added. Set reference to calculate measurements.`);
      }
    });

    setReferenceBtn.addEventListener('click', (event) => {
      event.preventDefault();
      if (!state.image) {
        setStatus('Upload an image first.');
        return;
      }

      if (state.lines.length === 0) {
        setStatus('Draw at least one line before setting reference.');
        return;
      }

      const rawValue = Number.parseFloat(referenceValue.value);
      if (!Number.isFinite(rawValue) || rawValue <= 0) {
        setStatus('Enter a valid positive reference value first.');
        return;
      }

      const targetIndex = state.selectedLineIndex ?? 0;
      const targetLine = state.lines[targetIndex];
      if (!targetLine) {
        setStatus('Select a valid line to use as reference.');
        return;
      }

      state.lines.forEach((line) => { line.type = 'measurement'; });
      targetLine.type = 'reference';

      const knownInches = referenceUnit.value === 'cm' ? rawValue / 2.54 : rawValue;
      state.reference.lineIndex = targetIndex;
      state.reference.knownInches = knownInches;
      syncScaleFromReferenceLine();
      draw();

      if (!state.scaleInchesPerImagePixel) {
        setStatus('Could not compute scale from selected reference line.');
        return;
      }

      const knownCm = knownInches * 2.54;
      setStatus(`Scale set from line ${targetIndex + 1}: ${knownInches.toFixed(2)} in / ${knownCm.toFixed(2)} cm. Draw or adjust lines to see measurements.`);
    });

    undoBtn.addEventListener('click', () => {
      setStatus('Undo arrives in a later stage.');
    });

    clearBtn.addEventListener('click', () => {
      setStatus('Clear lines arrives in a later stage.');
    });

    resetBtn.addEventListener('click', () => {
      state.image = null;
      state.lines = [];
      state.draftLine = null;
      state.endpointDrag = null;
      state.selectedLineIndex = null;
      state.scaleInchesPerImagePixel = null;
      state.reference.lineIndex = null;
      state.reference.knownInches = null;
      state.viewport.zoom = 1;
      state.viewport.baseScale = 1;
      state.viewport.offsetX = 0;
      state.viewport.offsetY = 0;
      imageInput.value = '';
      referenceValue.value = '';
      referenceUnit.value = 'in';
      setControlsEnabled(false);
      setStatus('Reset complete. Upload a new image.');
      hint.textContent = 'Hint: Draw a reference line first.';
      draw();
    });

    setControlsEnabled(false);
    draw();
  </script>
</body>
</html>
